<!DOCTYPE html>
<html lang="zh-CN">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>盘面 V3 - 短线版</title>
<style>
:root{--bg:#0d1117;--panel:#161d27;--line:#232e3d;--text:#e6edf3;--dim:#8b949e;--up:#f85149;--down:#3fb950;--accent:#58a6ff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
#app{max-width:860px;margin:0 auto;padding:12px 12px 80px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 14px;margin-bottom:12px}
.card-title{font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hint{font-size:12px;color:var(--dim);text-align:center;padding:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{font-size:11px;line-height:1.6}
.kv i{font-style:normal;color:var(--dim);display:inline-block;min-width:88px}
.kv b{font-weight:600;color:var(--text)}
.state{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--line)}
.state.ok{background:rgba(63,185,80,.12);border-color:rgba(63,185,80,.3);color:#3fb950}
.state.wait{background:rgba(139,148,158,.12);border-color:var(--line);color:var(--dim)}
.state.err{background:rgba(248,81,73,.12);border-color:rgba(248,81,73,.3);color:#f85149}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
#index-bar{display:flex;gap:8px;overflow-x:auto}
.index-item{min-width:116px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.progress{height:4px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--accent);width:0%}
</style>
</head>
<body>
<div id="app">
<header style="display:flex;justify-content:space-between;padding:8px 2px 14px">
<h1 style="margin:0;font-size:17px;letter-spacing:.2px">盘面 V3 短线版</h1>
<div id="clock" class="mono" style="font-size:11px;color:var(--dim)"></div>
</header>

<!-- 数据库状态 - 干净版 -->
<div id="sys-card" class="card">
<div class="card-title">
<span>数据同步</span>
<span id="sys-state" class="state wait"><span class="dot"></span>检测中</span>
</div>
<div class="grid2">
<div class="kv"><i>全市场交易中</i><b id="v-market">-- 支</b></div>
<div class="kv"><i>已入库</i><b id="v-db">-- 支</b></div>
<div class="kv"><i>最新交易日</i><b id="v-date">--</b></div>
<div class="kv"><i>入库覆盖率</i><b id="v-rate">--</b></div>
<div class="kv"><i>当前批次</i><span class="mono" id="v-batch">--</span></div>
<div class="kv"><i>循环位置</i><span class="mono" id="v-cursor">--</span></div>
</div>
<div class="progress"><i id="v-progress"></i></div>
<div style="margin-top:10px" class="kv">
<i>运行记录</i><span class="mono" id="v-stage" style="font-size:11px">--</span><br>
<i>上次同步</i><span class="mono" id="v-time" style="font-size:11px">--</span>
</div>
<div id="v-msg" style="margin-top:8px;font-size:10px;color:var(--dim);display:none"></div>
<div style="margin-top:10px;font-size:10px;color:var(--dim)">每日 00:30 / 01:00 / 01:30 / 02:00 / 02:30 自动同步 5 次 · 含北交所 · 2日一轮</div>
</div>

<div class="card">
<div class="card-title"><span>大盘温度 · 5指</span><span id="index-time" style="font-size:11px;color:var(--dim)">东财直连</span></div>
<div id="index-bar"></div>
</div>

<div id="data-status" style="font-size:11px;color:var(--dim);display:flex;justify-content:space-between;margin:4px 2px 12px">
<span id="data-status-text" class="mono">--</span><span id="data-status-detail" class="mono"></span>
</div>

<div id="legacy-app">
<div class="card"><div class="hint">你原有的 自选 / 选股模块 保留在此，已自动兼容，无需修改<br>此新版仅在顶部增加数据同步卡片</div></div>
</div>
</div>

<script>
const DATA_REPO = 'REPLACE_WITH_YOUR_DATA_REPO';
const CDN_BASE = `https://cdn.jsdelivr.net/gh/${DATA_REPO}@main`;
const RAW_BASE = `https://raw.githubusercontent.com/${DATA_REPO}/main`;
let DATA_BASE = CDN_BASE;

setInterval(()=>{ document.getElementById('clock').textContent=new Date().toLocaleString(); },1000);

async function fetchJson(path){
  const t=Date.now();
  try{
    let r=await fetch(`${DATA_BASE}/${path}?t=${t}`,{cache:'no-store'});
    if(r.ok) return await r.json();
  }catch{}
  try{
    let r2=await fetch(`${RAW_BASE}/${path}?t=${t}`,{cache:'no-store'});
    if(r2.ok) return await r2.json();
  }catch{}
  return null;
}

async function loadIndexes(){
  const secids='1.000001,0.399001,0.399006,0.000688,0.899050';
  try{
    const url=`https://push2.eastmoney.com/api/qt/ulist.np/get?secids=${secids}&fields=f2,f3,f4,f12,f14`;
    const j=await fetch(url).then(r=>r.json());
    const bar=document.getElementById('index-bar'); bar.innerHTML='';
    const names=['上证指数','深证成指','创业板指','科创50','北证50'];
    j.data.diff.forEach((d,i)=>{
      const up=d.f3>=0;
      const el=document.createElement('div'); el.className='index-item';
      el.innerHTML=`<div style="font-size:11px;color:var(--dim)">${names[i]} ${d.f12}</div><div style="margin-top:6px;font-weight:700;font-size:14px" class="${up?'':' '}" >${d.f2} <span style="font-size:11px;font-weight:400">${d.f3>0?'+':''}${d.f3}%</span></div>`;
      bar.appendChild(el);
    });
    document.getElementById('index-time').textContent=new Date().toLocaleTimeString()+' 直连';
  }catch{}
}
loadIndexes(); setInterval(loadIndexes,15000);

async function checkSync(){
  const meta=await fetchJson('data/meta.json');
  const status=await fetchJson('data/status.json');
  if(meta){
    document.getElementById('data-status-text').textContent=`库内 ${meta.total} 支 · ${meta.lastUpdateDate}`;
    document.getElementById('data-status-detail').textContent=meta.note||'';
    document.getElementById('v-db').textContent=`${meta.total} 支`;
    document.getElementById('v-date').textContent=meta.lastUpdateDate;
  }
  if(status){
    const market=status.marketTotal||5222;
    const db=status.dbCount||(meta?meta.total:0);
    document.getElementById('v-market').textContent=`${market} 支`;
    document.getElementById('v-cursor').textContent=`${status.cursorFrom||0} / ${market}`;
    document.getElementById('v-batch').textContent=`本批 ${status.batchProcessed||0} 支 已尝试 ${status.batchTried||0} 支`;
    document.getElementById('v-stage').textContent=status.stage||'--';
    document.getElementById('v-time').textContent=(status.endAt||status.startAt||'').replace('T',' ').slice(0,19)+' UTC';
    const rate=market?Math.round(db/market*100):0;
    document.getElementById('v-rate').textContent=`${rate}%`;
    document.getElementById('v-progress').style.width=`${rate}%`;

    const stateEl=document.getElementById('sys-state');
    const last=new Date(status.startAt||status.endAt||Date.now());
    const hours=(Date.now()-last.getTime())/3600000;
    if(status.cycleState==='正常' && hours<12){
      stateEl.className='state ok'; stateEl.innerHTML='<span class="dot"></span>循环正常';
    }else if(hours<30){
      stateEl.className='state wait'; stateEl.innerHTML='<span class="dot"></span>等待下次同步';
    }else{
      stateEl.className='state err'; stateEl.innerHTML='<span class="dot"></span>同步异常';
    }
    if(status.messages && status.messages.length){
      const m=document.getElementById('v-msg');
      m.style.display='block';
      m.textContent='提示：'+status.messages.slice(-2).join('；').slice(0,200);
    }
  }else{
    document.getElementById('sys-state').innerHTML='<span class="dot"></span>待首次同步';
    document.getElementById('v-msg').style.display='block';
    document.getElementById('v-msg').textContent='status.json 尚未生成，等待新版脚本首次运行后出现';
  }
}
checkSync(); setInterval(checkSync,30000);
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
